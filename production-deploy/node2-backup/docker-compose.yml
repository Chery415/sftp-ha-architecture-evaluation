version: "3.8"

networks:
  sftp-node2-net:
    driver: bridge

volumes:
  pg-standby-data:
  minio-2-data:
  sftpgo-2-data:

services:
  # ==========================================
  # 1. PostgreSQL (從資料庫 Standby - 唯讀串流複寫)
  # ==========================================
  pg-standby:
    image: postgres:15-alpine
    container_name: sftp-postgres-standby
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sftpgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sftpgopassword}
      POSTGRES_DB: ${POSTGRES_DB:-sftpgo}
      POSTGRES_PRIMARY_HOST: ${NODE1_IP}
      POSTGRES_PRIMARY_PORT: 5432
      POSTGRES_REPLICATOR_PASSWORD: ${POSTGRES_REPLICATOR_PASSWORD:-replicatorpassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/sh", "/entrypoint-custom.sh"]
    volumes:
      - ./config/postgres/standby-entrypoint.sh:/entrypoint-custom.sh:ro
      - pg-standby-data:/var/lib/postgresql/data
    networks:
      - sftp-node2-net

  # ==========================================
  # 2. MinIO S3 (節點 2 儲存體)
  # ==========================================
  minio-2:
    image: cgr.dev/chainguard/minio:latest
    container_name: sftp-minio-2
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    command: server /data --console-address ":9001"
    volumes:
      - minio-2-data:/data
    networks:
      - sftp-node2-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ==========================================
  # 3. SFTPGo (節點 2 運算服務)
  # ==========================================
  sftpgo-2:
    image: drakkan/sftpgo:v2.6-alpine
    container_name: sftp-sftpgo-2
    restart: unless-stopped
    ports:
      - "2022:2022" # SFTP 內部埠
      - "8080:8080" # Web Admin 內部埠
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: postgresql
      SFTPGO_DATA_PROVIDER__NAME: ${POSTGRES_DB:-sftpgo}
      SFTPGO_DATA_PROVIDER__HOST: ${NODE1_IP} # 連接 Node 1 主庫
      SFTPGO_DATA_PROVIDER__PORT: 5432
      SFTPGO_DATA_PROVIDER__USERNAME: ${POSTGRES_USER:-sftpgo}
      SFTPGO_DATA_PROVIDER__PASSWORD: ${POSTGRES_PASSWORD:-sftpgopassword}
      SFTPGO_DATA_PROVIDER__SSLMODE: 0
      SFTPGO_SFTPD__BINDINGS__0__PORT: 2022
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER:-admin}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-adminpassword}
      SFTPGO_LOG_LEVEL: info
    volumes:
      - sftpgo-2-data:/var/lib/sftpgo
    networks:
      - sftp-node2-net
    depends_on:
      minio-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2022 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ==========================================
  # 4. HAProxy (本機入口負載平衡器)
  # ==========================================
  haproxy-2:
    image: haproxy:2.8-alpine
    container_name: sftp-haproxy-2
    restart: unless-stopped
    ports:
      - "2222:2222" # 對外 SFTP VIP 服務埠
      - "8081:8081" # 對內 Web 服務埠
      - "8404:8404" # 叢集儀表板
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - sftp-node2-net
    depends_on:
      sftpgo-2:
        condition: service_healthy

  # ==========================================
  # 5. Keepalived (Backup 節點 - 監控 VIP)
  # ==========================================
  keepalived-2:
    image: osixia/keepalived:2.0.20
    container_name: sftp-keepalived-2
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    entrypoint: ["/bin/sh", "-c", "chmod 644 /container/service/keepalived/assets/keepalived.conf && exec /container/tool/run --copy-service"]
    volumes:
      - ./config/keepalived/keepalived.conf:/container/service/keepalived/assets/keepalived.conf
    depends_on:
      - haproxy-2
