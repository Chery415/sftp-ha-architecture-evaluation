global_defs {
    router_id SFTP_BACKUP
    vrrp_version 3
}

vrrp_script chk_sftp {
    script "/bin/nc -z 172.28.0.42 2022"
    interval 2
    weight -20
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass SFTP_HA_123
    }

    virtual_ipaddress {
        172.28.0.100/16 dev eth0 label eth0:vip
    }

    track_script {
        chk_sftp
    }
}
